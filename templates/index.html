<!DOCTYPE html>
<html>
<head>
    <title>Smart Hospital</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        /* HERO BACKGROUND */
        .hero-section {
            height: 100vh;
            background:
                linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
                url("https://images.unsplash.com/photo-1586773860418-d37222d8fce3");
            background-size: cover;
            background-position: center;
            color: white;
            display: flex;
            flex-direction: column;
            animation: fadeIn 2s ease-in-out;
        }

        /* Fade Animation */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Navbar */
        .navbar {
            background: rgba(0,0,0,0.85) !important;
        }

        /* Hero content */
        .hero-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            animation: fadeUp 2s ease-in-out;
        }

        /* Slide Up Animation */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typing Effect */
        .typing {
            border-right: 3px solid white;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 4s steps(40, end),
                       blink 0.7s infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            50% { border-color: transparent }
        }

        /* Animated Buttons */
        .btn-custom {
            padding: 10px 30px;
            border-radius: 30px;
            transition: 0.3s ease;
        }

        .btn-custom:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
        }

    </style>
</head>

<body>

<div class="hero-section">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <span class="navbar-brand fw-bold">🏥 Smart Hospital</span>

            <div>
                <a href="/login" class="btn btn-outline-light btn-sm me-2">Login</a>
                <a href="/register" class="btn btn-warning btn-sm me-2">Register</a>
                <a href="/admin" class="btn btn-danger btn-sm">Admin</a>
            </div>
        </div>
    </nav>

    <!-- HERO CONTENT -->
    <div class="hero-content">

        <h1 class="display-3 fw-bold typing">
            Welcome to Smart Hospital
        </h1>

        <p class="lead mt-3">
            Online Appointment Booking & Management System
        </p>

        <div class="mt-4">
            <a href="/register" class="btn btn-primary btn-custom me-3">
                Get Started
            </a>

            <a href="/admin" class="btn btn-dark btn-custom">
                Admin Panel
            </a>
        </div>

    </div>

</div>

</body>
</html>
