<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in… — Smart Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script>window.__clerk_publishable_key = "{{ clerk_publishable_key }}";</script>
</head>

<body class="bg-light d-flex flex-column min-vh-100 align-items-center justify-content-center">

    <div class="card card-modern p-5 text-center" style="max-width:420px; width:100%;">
        <div class="navbar-brand-icon mx-auto mb-4" style="width:56px;height:56px;font-size:1.8rem;">
            <i class="bi bi-shield-check text-white"></i>
        </div>
        <h4 class="fw-bold mb-2">Completing Sign-In</h4>
        <p class="text-muted small mb-4">Please wait while we verify your identity…</p>
        <div class="spinner-border text-primary mx-auto" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p id="status-msg" class="text-muted small mt-3"></p>
    </div>

    <!-- ClerkJS callback handler -->
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" type="text/javascript"></script>
    <script>
        async function handleCallback() {
            const statusEl = document.getElementById("status-msg");
            try {
                const clerk = new window.Clerk(window.__clerk_publishable_key);
                await clerk.load();

                if (!clerk.session) {
                    statusEl.textContent = "No session found. Redirecting to login…";
                    setTimeout(() => window.location.href = "/login", 2000);
                    return;
                }

                statusEl.textContent = "Session verified. Syncing…";
                const token = await clerk.session.getToken();
                const res = await fetch("/clerk_sync", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + token }
                });
                const data = await res.json();
                if (data.ok) {
                    statusEl.textContent = "Success! Redirecting to dashboard…";
                    window.location.href = data.redirect || "/dashboard";
                } else {
                    statusEl.textContent = "Sync failed: " + (data.error || "Unknown error");
                    setTimeout(() => window.location.href = "/login", 2000);
                }
            } catch (e) {
                console.error("[Clerk callback]", e);
                document.getElementById("status-msg").textContent = "Error: " + e.message;
                setTimeout(() => window.location.href = "/login", 3000);
            }
        }

        handleCallback();
    </script>
</body>

</html>
