<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
body {
    background:
        linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
        url("{{ url_for('static', filename='hospital.jpg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 100vh;
    color: white;
}
</style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <span class="navbar-brand">Smart Hospital</span>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="nav">
        <a href="/history" class="btn btn-outline-light btn-sm me-2">My Appointments</a>
        <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">

    {% if notifications|length > 0 %}
    <div class="alert alert-warning alert-dismissible fade show" role="alert">
        <h5>Notifications</h5>
        {% for notification in notifications %}
        <p class="mb-2">
            <strong>{{ notification[2] }}</strong>
        </p>
        {% endfor %}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endif %}

    <div class="row">
        {% for doctor in doctors %}
        <div class="col-12 col-md-6 col-lg-4 mb-4">
            <div class="card text-center p-3 shadow">
                <h5>{{ doctor[1] }}</h5>
                <p>{{ doctor[2] }}</p>
                <a href="/book/{{ doctor[1] }}" class="btn btn-primary w-100">
                    Book Appointment
                </a>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
