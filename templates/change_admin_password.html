<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Admin Password — Smart Hospital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body class="bg-light d-flex flex-column min-vh-100 justify-content-between">

    <!-- NAVBAR -->
    <nav class="navbar navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom" href="/admin_dashboard">
                <span class="navbar-brand-icon"
                    style="background: linear-gradient(135deg, #1e293b 0%, #334155 100%);"><i
                        class="bi bi-shield-lock"></i></span>
                Admin Panel
            </a>
            <a href="/admin_dashboard" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-left me-1"></i> Dashboard
            </a>
        </div>
    </nav>

    <!-- CONTENT -->
    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card card-modern p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="navbar-brand-icon mx-auto mb-3"
                            style="width: 52px; height: 52px; font-size: 1.5rem; background: #0f172a;">
                            <i class="bi bi-key text-warning"></i>
                        </div>
                        <h4 class="fw-bold text-dark">Update Password</h4>
                        <p class="text-muted small">Change master administrator password</p>
                    </div>

                    {% with messages = get_flashed_messages() %}
                    {% if messages %}
                    {% for msg in messages %}
                    <div class="alert alert-warning alert-custom py-2 mb-3 small d-flex align-items-center gap-2">
                        <i class="bi bi-info-circle"></i>
                        <span>{{ msg }}</span>
                    </div>
                    {% endfor %}
                    {% endif %}
                    {% endwith %}

                    <form method="POST" action="/change_admin_password">
                        <div class="mb-4">
                            <label class="form-label form-label-modern">New Admin Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i
                                        class="bi bi-lock"></i></span>
                                <input type="password" name="new_password" id="newPass"
                                    class="form-control form-control-modern border-start-0 border-end-0 ps-0"
                                    placeholder="Enter new password" required>
                                <button class="btn btn-outline-secondary border-start-0 bg-white text-muted"
                                    type="button" onclick="togglePass()">
                                    <i class="bi bi-eye" id="passIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark py-2">
                                <i class="bi bi-check-lg me-1"></i> Save New Password
                            </button>
                            <a href="/admin_dashboard" class="btn btn-outline-secondary py-2 rounded-pill">
                                Back to Dashboard
                            </a>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer-custom py-3 text-center small text-secondary">
        Smart Hospital System &copy; 2026. Security Administration.
    </footer>

    <script>
        function togglePass() {
            var pass = document.getElementById("newPass");
            var icon = document.getElementById("passIcon");
            if (pass.type === "password") {
                pass.type = "text";
                icon.classList.remove("bi-eye");
                icon.classList.add("bi-eye-slash");
            } else {
                pass.type = "password";
                icon.classList.remove("bi-eye-slash");
                icon.classList.add("bi-eye");
            }
        }
    </script>
</body>

</html>
