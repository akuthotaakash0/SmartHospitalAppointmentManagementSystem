<!DOCTYPE html>
<html>
<head>
    <title>Edit Doctor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5 col-md-5">
    <div class="card shadow">
        <div class="card-body">
            <h4>Edit Doctor</h4>
            <form method="POST">
                <input name="name" value="{{ doctor[1] }}" class="form-control mb-3">
                <input name="specialization" value="{{ doctor[2] }}" class="form-control mb-3">
                <input name="image" value="{{ doctor[3] }}" class="form-control mb-3">
                <button class="btn btn-primary w-100">Update</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
